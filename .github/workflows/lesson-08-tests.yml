name: Lesson 08 Official Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out student repository
        uses: actions/checkout@v6
        with:
          path: student-repo

      - name: Check out official tests
        uses: actions/checkout@v6
        with:
          repository: WVUP/weird-ai-tests
          path: official-tests

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install student project
        working-directory: student-repo
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.test.txt
          pip install -e .

      - name: Run Lesson 08 tests
        run: |
          pytest official-tests/tests/lesson08 -v
